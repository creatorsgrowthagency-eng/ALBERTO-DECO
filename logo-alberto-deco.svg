<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" style="color:#1e3a5f;">
  <defs>
    <style>
      .ad-serif{ font-family:'Fraunces','Liberation Serif','Times New Roman',serif; }
      .ad-sans{ font-family:'Work Sans','Liberation Sans',Arial,sans-serif; }
    </style>
  </defs>

  <g fill="none" stroke="currentColor">
    <!-- outer ring -->
    <circle cx="200" cy="200" r="192" stroke-width="2.4"/>
    <circle cx="200" cy="200" r="182" stroke-width="1"/>

    <!-- top arc ornament -->
    <path d="M 130 56 A 172 172 0 0 1 270 56" stroke-width="1.4"/>
    <path d="M 144 44 A 186 186 0 0 1 256 44" stroke-width="1.4"/>
    <path d="M 130 56 L 144 44 M 270 56 L 256 44" stroke-width="1.4"/>
    <circle cx="200" cy="36" r="3.2" fill="currentColor" stroke="none"/>

    <!-- LEFT flourish — large baroque scroll, Versace-scaled -->
    <g stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 152 152 C 116 144 84 122 68 88 C 58 66 64 40 88 30 C 106 23 124 34 122 52 C 121 64 108 70 100 60"/>
      <path d="M 122 52 C 132 46 132 32 120 26 C 112 22 104 26 104 34"/>
      <path d="M 152 152 C 168 138 180 118 182 96"/>
      <path d="M 130 122 C 112 116 98 102 92 84"/>
      <path d="M 96 96 C 88 92 82 84 80 74"/>
    </g>
    <!-- RIGHT flourish — mirrored -->
    <g stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 248 152 C 284 144 316 122 332 88 C 342 66 336 40 312 30 C 294 23 276 34 278 52 C 279 64 292 70 300 60"/>
      <path d="M 278 52 C 268 46 268 32 280 26 C 288 22 296 26 296 34"/>
      <path d="M 248 152 C 232 138 220 118 218 96"/>
      <path d="M 270 122 C 288 116 302 102 308 84"/>
      <path d="M 304 96 C 312 92 318 84 320 74"/>
    </g>
  </g>

  <!-- building / palazzo icon -->
  <g fill="none" stroke="currentColor" stroke-width="2.2">
    <path d="M 200 74 L 234 102 L 166 102 Z"/>
    <circle cx="200" cy="91" r="5.2"/>
    <line x1="200" y1="74" x2="200" y2="63"/>
    <circle cx="200" cy="59" r="2.8" fill="currentColor"/>
    <rect x="159" y="102" width="82" height="58" stroke-width="2.2"/>
    <line x1="153" y1="102" x2="247" y2="102" stroke-width="2.6"/>
    <line x1="180" y1="108" x2="180" y2="160"/>
    <line x1="220" y1="108" x2="220" y2="160"/>
    <path d="M 192 160 L 192 130 A 8 8 0 0 1 208 130 L 208 160"/>
    <rect x="166" y="120" width="10" height="17"/>
    <rect x="224" y="120" width="10" height="17"/>
    <line x1="148" y1="160" x2="252" y2="160" stroke-width="2.6"/>
    <line x1="143" y1="166" x2="257" y2="166" stroke-width="1.8"/>
  </g>

  <!-- rule above wordmark -->
  <line x1="76" y1="200" x2="324" y2="200" stroke="currentColor" stroke-width="1.5"/>
  <rect x="72" y="196.3" width="7.4" height="7.4" transform="rotate(45 75.7 200)" fill="currentColor"/>
  <rect x="320.6" y="196.3" width="7.4" height="7.4" transform="rotate(45 324.3 200)" fill="currentColor"/>

  <!-- wordmark -->
  <text x="200" y="238" text-anchor="middle" class="ad-serif" font-size="40" font-weight="600" letter-spacing="3" fill="currentColor">ALBERTO D&#201;CO</text>

  <!-- rule below wordmark -->
  <line x1="76" y1="256" x2="324" y2="256" stroke="currentColor" stroke-width="1.5"/>
  <rect x="72" y="252.3" width="7.4" height="7.4" transform="rotate(45 75.7 256)" fill="currentColor"/>
  <rect x="320.6" y="252.3" width="7.4" height="7.4" transform="rotate(45 324.3 256)" fill="currentColor"/>

  <!-- ornate scroll flourish below wordmark, enlarged to match -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M 118 288 C 150 274 168 306 200 292 C 232 306 250 274 282 288"/>
    <path d="M 118 288 C 104 292 92 288 88 276"/>
    <path d="M 282 288 C 296 292 308 288 312 276"/>
    <path d="M 150 282 C 158 288 170 289 178 285"/>
    <path d="M 250 282 C 242 288 230 289 222 285"/>
    <circle cx="200" cy="293.5" r="3" fill="currentColor"/>
  </g>

  <!-- curved "SINCE 1989" following the lower ring -->
  <path id="curveBottom3" d="M 90 268 A 172 172 0 0 0 310 268" fill="none"/>
  <text class="ad-sans" font-size="15" letter-spacing="6" fill="currentColor">
    <textPath href="#curveBottom3" startOffset="50%" text-anchor="middle">SINCE 1989</textPath>
  </text>
</svg>
